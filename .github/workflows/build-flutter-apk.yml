name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Generate missing platform files (android/ios)
        run: flutter create --platforms=android --project-name gamevault --org com.ajatpns .

      - name: Bump Android Gradle Plugin to 8.1.1 (required by androidx.webkit)
        run: |
          sed -i 's/"com.android.application" version "8.1.0"/"com.android.application" version "8.1.1"/' android/settings.gradle
          cat android/settings.gradle

      - name: Bump Kotlin Gradle plugin to 2.1.0 (required by play-services-ads)
        run: |
          sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[0-9.]+(")/\12.1.0\2/' android/settings.gradle
          cat android/settings.gradle

      - name: Install Google Mobile Ads (AdMob) App ID into manifest
        run: |
          sed -i '/android:icon="@mipmap\/ic_launcher">/a\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4745209091204946~1801167791"/>' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Bump minSdkVersion to 23 (required by google_mobile_ads)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          cat android/app/build.gradle

      - name: Ensure INTERNET permission for release builds
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Fix app label capitalization
        run: |
          sed -i 's/android:label="gamevault"/android:label="Gamevault"/' android/app/src/main/AndroidManifest.xml

      - name: Configure deep link for password reset
        run: |
          sed -i '/<\/activity>/i\
              <intent-filter>\
                  <action android:name="android.intent.action.VIEW" />\
                  <category android:name="android.intent.category.DEFAULT" />\
                  <category android:name="android.intent.category.BROWSABLE" />\
                  <data android:scheme="gamevault" android:host="reset-callback" />\
              </intent-filter>' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/gamevault-release.jks

      - name: Configure release signing
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=gamevault
          storeFile=gamevault-release.jks
          EOF

          sed -i '/^android {/a\
              def keystorePropertiesFile = rootProject.file("key.properties")\
              def keystoreProperties = new Properties()\
              if (keystorePropertiesFile.exists()) {\
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
              }\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                      storeFile file(keystoreProperties["storeFile"])\
                      storePassword keystoreProperties["storePassword"]\
                  }\
              }' android/app/build.gradle

          sed -i -E 's/signingConfig(\s*=\s*|\s+)signingConfigs\.debug/signingConfig = signingConfigs.release/' android/app/build.gradle
          echo "=== FULL build.gradle content (always shown) ==="
          cat android/app/build.gradle
          echo "=== Verifying release signing actually points to release keystore ==="
          if ! grep -q "signingConfig = signingConfigs.release" android/app/build.gradle; then
            echo "FATAL: release buildType is NOT using signingConfigs.release — refusing to build a debug-signed APK."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Game Vault â€” Latest Build"
          body: "Automatically updated with every successful build. This is the file to link from your website's download button."
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
