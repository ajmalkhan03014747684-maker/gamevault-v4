name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Generate missing platform files (android/ios)
        run: flutter create --platforms=android --project-name gamevault --org com.ajatpns .

      - name: Install Huawei AGConnect config file
        run: cp agconnect-services.json android/app/agconnect-services.json

      - name: Add Huawei Maven repo and AGConnect classpath to root build.gradle
        run: |
          sed -i '/repositories {/a\        maven { url "https://developer.huawei.com/repo/" }' android/build.gradle
          sed -i '1i\
buildscript {\
    repositories {\
        google()\
        mavenCentral()\
        maven { url "https://developer.huawei.com/repo/" }\
    }\
    dependencies {\
        classpath "com.huawei.agconnect:agcp:1.9.1.300"\
    }\
}
' android/build.gradle
          cat android/build.gradle

      - name: Apply AGConnect plugin to app module
        run: |
          echo "apply plugin: 'com.huawei.agconnect'" >> android/app/build.gradle
          cat android/app/build.gradle

      - name: Ensure INTERNET permission for release builds
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Fix app label capitalization
        run: |
          sed -i 's/android:label="gamevault"/android:label="Gamevault"/' android/app/src/main/AndroidManifest.xml

      - name: Configure deep link for password reset
        run: |
          sed -i '/<\/activity>/i\
              <intent-filter>\
                  <action android:name="android.intent.action.VIEW" />\
                  <category android:name="android.intent.category.DEFAULT" />\
                  <category android:name="android.intent.category.BROWSABLE" />\
                  <data android:scheme="gamevault" android:host="reset-callback" />\
              </intent-filter>' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/gamevault-release.jks

      - name: Configure release signing
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=gamevault
          storeFile=gamevault-release.jks
          EOF

          sed -i '/^android {/a\
              def keystorePropertiesFile = rootProject.file("key.properties")\
              def keystoreProperties = new Properties()\
              if (keystorePropertiesFile.exists()) {\
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
              }\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                      storeFile file(keystoreProperties["storeFile"])\
                      storePassword keystoreProperties["storePassword"]\
                  }\
              }' android/app/build.gradle

          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle
          cat android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Game Vault â€” Latest Build"
          body: "Automatically updated with every successful build. This is the file to link from your website's download button."
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
